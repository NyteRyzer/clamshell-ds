name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The hosted runner already has the Android SDK; AGP fetches the NDK/CMake it needs.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ClamshellDS.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ClamshellDS-apk
          path: out/ClamshellDS.apk

      # Every push to a branch refreshes the "latest" pre-release, so the newest
      # APK is always one tap away at .../releases/tag/latest
      - name: Publish latest build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clamshell DS (latest build)
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            Latest automatic build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **ClamshellDS.apk** below and open it on your handheld to install.
          files: out/ClamshellDS.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ClamshellDS.apk

  # Boots an Android 14 emulator with a simulated second screen and checks that the
  # menu and a test game start without crashing. Crash logs are printed in this job.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ClamshellDS-apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke-test.sh out/ClamshellDS.apk
